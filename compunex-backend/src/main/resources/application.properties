spring.application.name=compunex-backend
server.port=8080

# Conexion a Base de Datos MySQL (usuario dedicado compunex_app != root)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/compunex_b2b?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:compunex_app}
spring.datasource.password=${DB_PASSWORD:98306001}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Seguridad JWT
jwt.secret=${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Documentacion Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Carga de Imagenes / Media (Sprint-B09)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.media.upload-dir=${MEDIA_UPLOAD_DIR:uploads}
